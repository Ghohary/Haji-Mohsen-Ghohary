<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - GHOHARY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-nude: #E8DDD1;
            --color-beige: #D4C5B0;
            --color-brown: #8B6F47;
            --color-gold: #B8936D;
            --color-deep-brown: #5C4A36;
            --color-skin: #F5EBE0;
            --color-accent-gold: #D4AF37;
            --color-champagne: #F7E7CE;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--color-skin) 0%, var(--color-beige) 100%);
            color: var(--color-deep-brown);
            min-height: 100vh;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(92, 74, 54, 0.95);
            backdrop-filter: blur(20px);
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: 0.4em;
            color: var(--color-champagne);
            text-transform: uppercase;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--color-champagne);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--color-accent-gold);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-brown);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 1rem 0;
            transition: color 0.3s ease;
        }

        .back-button:hover {
            color: var(--color-accent-gold);
        }

        /* Product Container */
        .product-container {
            max-width: 1400px;
            margin: 6rem auto 3rem;
            padding: 0 5%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
        }

        /* Image Gallery */
        .product-gallery {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .main-product-image {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(92, 74, 54, 0.2);
        }

        .thumbnail-strip {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 1rem;
        }

        .product-thumbnail {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .product-thumbnail:hover,
        .product-thumbnail.active {
            border-color: var(--color-accent-gold);
            transform: scale(1.05);
        }

        /* Product Info */
        .product-info {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .product-category {
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--color-brown);
        }

        .product-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 300;
            color: var(--color-deep-brown);
            letter-spacing: 0.05em;
            line-height: 1.2;
        }

        .product-price {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 300;
            color: var(--color-accent-gold);
        }

        .product-description {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--color-brown);
            white-space: pre-line;
        }

        .product-specs {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(92, 74, 54, 0.1);
        }

        .spec-title {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--color-deep-brown);
            margin-bottom: 1.5rem;
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            padding: 1rem 0;
            border-bottom: 1px solid var(--color-beige);
        }

        .spec-item:last-child {
            border-bottom: none;
        }

        .spec-label {
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--color-brown);
        }

        .spec-value {
            font-size: 1rem;
            color: var(--color-deep-brown);
        }

        /* Contact Section */
        .contact-section {
            background: var(--color-deep-brown);
            color: var(--color-champagne);
            padding: 2.5rem;
            border-radius: 8px;
            text-align: center;
        }

        .contact-section h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 1.5rem;
            letter-spacing: 0.05em;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .contact-item {
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-contact {
            display: inline-block;
            padding: 1.2rem 3rem;
            background: var(--color-accent-gold);
            color: var(--color-deep-brown);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-contact:hover {
            background: var(--color-champagne);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }

        /* Related Products */
        .related-section {
            max-width: 1400px;
            margin: 4rem auto;
            padding: 0 5%;
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-weight: 300;
            color: var(--color-deep-brown);
            text-align: center;
            margin-bottom: 3rem;
            letter-spacing: 0.05em;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .related-card {
            position: relative;
            aspect-ratio: 3/4;
            overflow: hidden;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .related-card:hover {
            transform: translateY(-10px);
        }

        .related-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .related-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(92, 74, 54, 0.9) 0%, transparent 50%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .related-card:hover .related-overlay {
            opacity: 1;
        }

        .related-overlay h4 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: var(--color-champagne);
            margin-bottom: 0.5rem;
        }

        .related-overlay p {
            color: var(--color-champagne);
            font-size: 1.2rem;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .product-container {
                grid-template-columns: 1fr;
                gap: 2rem;
                margin-top: 5rem;
            }

            .nav-links {
                display: none;
            }

            .thumbnail-strip {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }

            .product-name {
                font-size: 2rem;
            }

            .product-price {
                font-size: 2rem;
            }

            .related-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">GHOHARY</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="collections.html">Collections</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="product-container">
        <div class="product-gallery">
            <img src="" alt="Product" class="main-product-image" id="mainProductImage">
            <div class="thumbnail-strip" id="thumbnailStrip"></div>
        </div>

        <div class="product-info">
            <a href="collections.html" class="back-button">← Back to Collections</a>
            
            <div class="product-category" id="productCategory">Category</div>
            <h1 class="product-name" id="productName">Product Name</h1>
            <div class="product-price" id="productPrice">AED 0</div>
            
            <p class="product-description" id="productDescription"></p>

            <div class="product-specs" id="productSpecs">
                <div class="spec-title">Product Details</div>
                <!-- Specs will be inserted here -->
            </div>

            <div class="contact-section">
                <h3>Inquire About This Piece</h3>
                <div class="contact-info">
                    <div class="contact-item">📞 +971 50 123 4567</div>
                    <div class="contact-item">✉️ contact@ghohary.com</div>
                    <div class="contact-item">📍 Dubai Design District, Dubai, UAE</div>
                </div>
                <a href="tel:+971501234567" class="btn-contact">Call Now</a>
            </div>
        </div>
    </div>

    <div class="related-section">
        <h2 class="section-title">You May Also Like</h2>
        <div class="related-grid" id="relatedGrid"></div>
    </div>

    <script>
        // Load current product from localStorage
        const product = JSON.parse(localStorage.getItem('currentProduct'));
        const allProducts = JSON.parse(localStorage.getItem('ghoharyProducts')) || [];

        if (!product) {
            // If no product selected, redirect to collections
            window.location.href = 'collections.html';
        } else {
            // Display product information
            document.getElementById('productCategory').textContent = formatCategory(product.category);
            document.getElementById('productName').textContent = product.name;
            document.getElementById('productPrice').textContent = `AED ${product.price.toLocaleString()}`;
            document.getElementById('productDescription').textContent = product.description || 'A stunning piece from our exclusive collection. Contact us to learn more about this exquisite creation.';
            
            // Update page title
            document.title = `${product.name} - GHOHARY`;

            // Display main image
            const mainImage = document.getElementById('mainProductImage');
            mainImage.src = product.images[0];

            // Display thumbnails
            const thumbnailStrip = document.getElementById('thumbnailStrip');
            product.images.forEach((img, index) => {
                const thumb = document.createElement('img');
                thumb.src = img;
                thumb.className = 'product-thumbnail' + (index === 0 ? ' active' : '');
                thumb.onclick = () => {
                    mainImage.src = img;
                    document.querySelectorAll('.product-thumbnail').forEach(t => t.classList.remove('active'));
                    thumb.classList.add('active');
                };
                thumbnailStrip.appendChild(thumb);
            });

            // Display product specs
            const specsContainer = document.getElementById('productSpecs');
            let specsHTML = '<div class="spec-title">Product Details</div>';
            
            if (product.sku) {
                specsHTML += `
                    <div class="spec-item">
                        <span class="spec-label">SKU</span>
                        <span class="spec-value">${product.sku}</span>
                    </div>
                `;
            }
            
            if (product.material) {
                specsHTML += `
                    <div class="spec-item">
                        <span class="spec-label">Material</span>
                        <span class="spec-value">${product.material}</span>
                    </div>
                `;
            }
            
            if (product.color) {
                specsHTML += `
                    <div class="spec-item">
                        <span class="spec-label">Color</span>
                        <span class="spec-value">${product.color}</span>
                    </div>
                `;
            }

            specsHTML += `
                <div class="spec-item">
                    <span class="spec-label">Category</span>
                    <span class="spec-value">${formatCategory(product.category)}</span>
                </div>
            `;
            
            specsContainer.innerHTML = specsHTML;

            // Display related products (same category, excluding current)
            const relatedProducts = allProducts
                .filter(p => p.category === product.category && p.id !== product.id)
                .slice(0, 3);

            const relatedGrid = document.getElementById('relatedGrid');
            relatedProducts.forEach(relatedProduct => {
                const card = document.createElement('div');
                card.className = 'related-card';
                card.onclick = () => {
                    localStorage.setItem('currentProduct', JSON.stringify(relatedProduct));
                    window.location.reload();
                };
                
                card.innerHTML = `
                    <img src="${relatedProduct.images[0]}" alt="${relatedProduct.name}">
                    <div class="related-overlay">
                        <h4>${relatedProduct.name}</h4>
                        <p>AED ${relatedProduct.price.toLocaleString()}</p>
                    </div>
                `;
                
                relatedGrid.appendChild(card);
            });
        }

        function formatCategory(cat) {
            const categories = {
                'evening': 'Evening Collection',
                'bridal': 'Bridal Couture',
                'rtw': 'Ready to Wear',
                'accessories': 'Accessories'
            };
            return categories[cat] || cat;
        }
    </script>
</body>
</html>
